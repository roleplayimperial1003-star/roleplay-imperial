name: Gerar APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Montar projeto do app
        run: |
          mkdir -p app/www app/assets
          cp manifest.json icon-192.png icon-512.png app/www/
          cp icon-only.png icon-foreground.png icon-background.png app/assets/
          cp index.html app/www/index.html
          sed -i "s#window.MR_SERVER=''#window.MR_SERVER='wss://roleplay-imperial-7uec.onrender.com/ws'#" app/www/index.html
          echo '{"name":"roleplay-imperial-app","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"^6.2.0","@capacitor/cli":"^6.2.0","@capacitor/core":"^6.2.0"},"devDependencies":{"@capacitor/assets":"^3.0.5"}}' > app/package.json
          echo '{"appId":"com.roleplay.imperial","appName":"Roleplay Imperial","webDir":"www","backgroundColor":"#0e1627"}' > app/capacitor.config.json

      - name: Instalar dependencias
        working-directory: app
        run: npm install

      - name: Criar projeto Android
        working-directory: app
        run: |
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/></manifest>#' android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android --assetPath assets
          npx cap sync android

      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: roleplay-imperial-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
